name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # به‌جای Gradle Wrapper از نصب مستقیم Gradle استفاده می‌کنیم
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fileo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # هر تگ v* → ریلیز خودکار با APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Fileo-${GITHUB_REF_NAME}-debug.apk"
          gh release create "${GITHUB_REF_NAME}" "Fileo-${GITHUB_REF_NAME}-debug.apk" --title "فایلو ${GITHUB_REF_NAME}" --generate-notes
